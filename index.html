<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👩‍❤️‍👨 双人 AI 记账管家 终极版</title>
    <!-- 引入 Chart.js 用于绘制消费饼图 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #1e293b; padding: 12px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; background: #fff; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); padding: 16px; min-height: 94vh; display: flex; flex-direction: column; position: relative; }
        
        /* 顶部看板 */
        .dashboard { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; padding: 16px; border-radius: 16px; margin-bottom: 12px; }
        .dash-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .dash-title { font-size: 12px; opacity: 0.9; }
        .dash-total { font-size: 26px; font-weight: bold; }
        .progress-bar-bg { background: rgba(255,255,255,0.25); height: 8px; border-radius: 4px; overflow: hidden; margin: 8px 0; }
        .progress-bar-fill { background: #34d399; height: 100%; width: 0%; transition: width 0.3s; }
        .budget-input-inline { background: rgba(255,255,255,0.2); border: none; color: white; width: 70px; text-align: right; padding: 2px 4px; border-radius: 4px; font-weight: bold; }

        /* 主导航 Tab */
        .main-tabs { display: flex; border-bottom: 2px solid #f1f5f9; margin-bottom: 12px; }
        .tab-btn { flex: 1; padding: 10px 0; border: none; background: none; font-size: 13px; font-weight: bold; color: #64748b; cursor: pointer; text-align: center; }
        .tab-btn.active { color: #4f46e5; border-bottom: 2px solid #4f46e5; margin-bottom: -2px; }

        /* 内容区域 */
        .tab-content { display: none; flex: 1; overflow-y: auto; flex-direction: column; gap: 12px; }
        .tab-content.active { display: flex; }

        /* 配置折叠面板 */
        details.config-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; font-size: 12px; margin-bottom: 10px; }
        details summary { font-weight: bold; cursor: pointer; color: #475569; }
        .config-group { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
        .config-group input, .config-group select { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; }

        /* 人设选择 */
        .persona-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
        .persona-btn { padding: 8px; border: 1px solid #e2e8f0; border-radius: 8px; background: white; cursor: pointer; text-align: center; font-size: 12px; font-weight: 500; }
        .persona-btn.active { border-color: #4f46e5; background: #eef2ff; color: #4f46e5; font-weight: bold; }

        /* 账单分组列表 */
        .date-group-title { font-size: 12px; font-weight: bold; color: #64748b; background: #f1f5f9; padding: 4px 8px; border-radius: 6px; margin-top: 6px; display: flex; justify-content: space-between; }
        .card { background: #fff; border: 1px solid #f1f5f9; box-shadow: 0 2px 6px rgba(0,0,0,0.02); border-radius: 12px; padding: 12px; margin-top: 6px; }
        .card-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; }
        .card-amount { color: #ef4444; }
        .card-sub { font-size: 11px; color: #94a3b8; margin: 4px 0 6px 0; }
        .ai-box { background: #f8fafc; border-left: 3px solid #6366f1; padding: 6px 8px; border-radius: 4px; font-size: 12px; color: #334155; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
        .ai-badge { background: #e0e7ff; color: #4338ca; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .btn-delete { color: #94a3b8; font-size: 11px; border: none; background: none; cursor: pointer; }

        /* 可视化与 AI 报告容器 */
        .chart-box, .report-box { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; text-align: center; }
        .report-content { text-align: left; font-size: 13px; line-height: 1.6; color: #334155; white-space: pre-line; background: #f8fafc; padding: 12px; border-radius: 8px; margin-top: 10px; }
        .btn-action { background: #4f46e5; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; }

        /* 底部固定输入栏 */
        .input-area { display: flex; gap: 6px; margin-top: auto; padding-top: 10px; border-top: 1px solid #f1f5f9; align-items: center; }
        .btn-mic { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px; cursor: pointer; font-size: 16px; }
        .btn-mic.recording { background: #fee2e2; border-color: #ef4444; animation: pulse 1s infinite; }
        .input-area input { flex: 1; padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; outline: none; font-size: 13px; }
        .input-area button.send { padding: 10px 16px; background: #4f46e5; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="app-container">
    <!-- 看板 -->
    <div class="dashboard">
        <div class="dash-row">
            <span class="dash-title">本月累计总支出 (留存最近半数据)</span>
            <div>
                <span class="dash-title">月预算 ￥</span>
                <input type="number" id="budgetInput" class="budget-input-inline" value="5000" onchange="updateBudget()">
            </div>
        </div>
        <div class="dash-total" id="totalExpense">￥0.00</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
        <div class="dash-row" style="font-size: 11px; opacity: 0.9;">
            <span id="budgetPercent">预算使用: 0%</span>
            <span id="budgetRemain">剩余: ￥5000</span>
        </div>
    </div>

    <!-- 顶部分页 Tab -->
    <div class="main-tabs">
        <button class="tab-btn active" onclick="switchTab('feed')">📝 明细</button>
        <button class="tab-btn" onclick="switchTab('chart')">📊 分类饼图</button>
        <button class="tab-btn" onclick="switchTab('report')">🏆 AI 颁奖月报</button>
    </div>

    <!-- TAB 1: 账单明细列表 -->
    <div id="tab-feed" class="tab-content active">
        <!-- API 配置 -->
        <details class="config-box">
            <summary>⚙️ API 平台与人设设置</summary>
            <div class="config-group">
                <label>选择 AI 平台：</label>
                <select id="platformPreset" onchange="applyPreset()">
                    <option value="zhipu-free">【免费推荐】智谱 GLM-4-Flash (官方免费)</option>
                    <option value="siliconflow-free">硅基流动 - Qwen2.5 (免费)</option>
                    <option value="deepseek-official">DeepSeek 官方 API</option>
                </select>
                <label>API Key：</label>
                <input type="password" id="apiKey" placeholder="粘贴 API Key" onchange="saveConfig()">
                <input type="hidden" id="apiHost"><input type="hidden" id="modelName">
            </div>
        </details>

        <!-- 人设选择 -->
        <div class="persona-grid">
            <button class="persona-btn active" id="btn-cat" onclick="setPersona('cat')">🐱 毒舌黑猫</button>
            <button class="persona-btn" id="btn-angel" onclick="setPersona('angel')">👼 夸夸天使</button>
            <button class="persona-btn" id="btn-abacus" onclick="setPersona('abacus')">🧮 算盘娘</button>
            <button class="persona-btn" id="btn-cyber" onclick="setPersona('cyber')">🤖 赛博理财</button>
        </div>

        <div id="feedList"></div>
    </div>

    <!-- TAB 2: 可视化饼图 -->
    <div id="tab-chart" class="tab-content">
        <div class="chart-box">
            <h3 style="font-size: 14px; margin-bottom: 10px;">近 30 天消费构成占比</h3>
            <canvas id="categoryChart" width="300" height="300"></canvas>
        </div>
    </div>

    <!-- TAB 3: AI 颁奖月报 -->
    <div id="tab-report" class="tab-content">
        <div class="report-box">
            <h3>🏆 双人月度消费颁奖典礼</h3>
            <p style="font-size: 12px; color: #64748b; margin: 6px 0;">一键让 AI 深度梳理近 30 天账单，生成专属总结与奖项</p>
            <button class="btn-action" id="genReportBtn" onclick="generateMonthlyReport()">✨ 召唤 AI 生成颁奖总结</button>
            <div class="report-content" id="reportResult" style="display:none;"></div>
        </div>
    </div>

    <!-- 底部输入框（带语音识别） -->
    <div class="input-area">
        <button class="btn-mic" id="micBtn" onclick="toggleVoiceInput()" title="按住语音输入">🎙️</button>
        <input type="text" id="userInput" placeholder="输入或语音，例: 打车 35" onkeypress="if(event.key==='Enter') addExpense()">
        <button class="send" id="sendBtn" onclick="addExpense()">记账</button>
    </div>
</div>

<script>
    let currentPersona = 'cat';
    let expenses = [];
    let monthlyBudget = Number(localStorage.getItem('monthly_budget') || 5000);
    let chartInstance = null;
    let isRecording = false;
    let recognition = null;

    const presets = {
        'zhipu-free': { host: 'https://open.bigmodel.cn/api/paas/v4', model: 'glm-4-flash' },
        'siliconflow-free': { host: 'https://api.siliconflow.cn/v1', model: 'Qwen/Qwen2.5-7B-Instruct' },
        'deepseek-official': { host: 'https://api.deepseek.com/v1', model: 'deepseek-chat' }
    };

    window.onload = function() {
        // 读取并清理过期（超过6个月/180天）数据
        loadAndCleanExpenses();
        
        document.getElementById('budgetInput').value = monthlyBudget;
        document.getElementById('platformPreset').value = localStorage.getItem('platform_preset') || 'zhipu-free';
        document.getElementById('apiKey').value = localStorage.getItem('api_key') || '';
        applyPreset();
        renderFeed();
        initSpeechRecognition();
    };

    // 1. 数据清理与读取（只留半年数据）
    function loadAndCleanExpenses() {
        const raw = JSON.parse(localStorage.getItem('expenses_history_v3') || '[]');
        const sixMonthsAgo = Date.now() - (180 * 24 * 60 * 60 * 1000);
        // 过滤 180 天以内数据
        expenses = raw.filter(item => (item.timestamp || Date.now()) >= sixMonthsAgo);
        localStorage.setItem('expenses_history_v3', JSON.stringify(expenses));
    }

    function updateBudget() {
        monthlyBudget = Number(document.getElementById('budgetInput').value) || 5000;
        localStorage.setItem('monthly_budget', monthlyBudget);
        renderFeed();
    }

    function applyPreset() {
        const selected = document.getElementById('platformPreset').value;
        const config = presets[selected];
        document.getElementById('apiHost').value = config.host;
        document.getElementById('modelName').value = config.model;
        localStorage.setItem('platform_preset', selected);
        saveConfig();
    }

    function saveConfig() {
        localStorage.setItem('api_key', document.getElementById('apiKey').value.trim());
    }

    function setPersona(type) {
        currentPersona = type;
        document.querySelectorAll('.persona-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-${type}`).classList.add('active');
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        event.target.classList.add('active');
        document.getElementById(`tab-${tabName}`).classList.add('active');

        if(tabName === 'chart') renderChart();
    }

    // 2. 语音识别支持 (Web Speech API)
    function initSpeechRecognition() {
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRec();
            recognition.lang = 'zh-CN';
            recognition.continuous = false;
            
            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                document.getElementById('userInput').value = text;
                stopVoiceInput();
            };
            
            recognition.onerror = stopVoiceInput;
            recognition.onend = stopVoiceInput;
        } else {
            document.getElementById('micBtn').style.display = 'none'; // 浏览器不支持则隐藏
        }
    }

    function toggleVoiceInput() {
        if(!recognition) return alert('当前浏览器不支持语音识别');
        const micBtn = document.getElementById('micBtn');
        if(!isRecording) {
            recognition.start();
            isRecording = true;
            micBtn.classList.add('recording');
        } else {
            stopVoiceInput();
        }
    }

    function stopVoiceInput() {
        if(recognition && isRecording) { recognition.stop(); }
        isRecording = false;
        document.getElementById('micBtn').classList.remove('recording');
    }

    // 3. 渲染明细列表（按日分组）
    function renderFeed() {
        const listEl = document.getElementById('feedList');
        listEl.innerHTML = '';
        let monthTotal = 0;

        // 按日期分组数据
        const groups = {};
        expenses.slice().reverse().forEach((item, idx) => {
            const originalIndex = expenses.length - 1 - idx;
            const dateStr = item.date || '未知日期';
            if(!groups[dateStr]) groups[dateStr] = { items: [], dayTotal: 0 };
            groups[dateStr].items.push({ ...item, originalIndex });
            groups[dateStr].dayTotal += Number(item.amount || 0);
            monthTotal += Number(item.amount || 0);
        });

        for(let date in groups) {
            const groupEl = document.createElement('div');
            groupEl.innerHTML = `
                <div class="date-group-title">
                    <span>📅 ${date}</span>
                    <span>当日: ￥${groups[date].dayTotal.toFixed(2)}</span>
                </div>
            `;
            
            groups[date].items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <span>${item.description}</span>
                        <span class="card-amount">￥${Number(item.amount).toFixed(2)}</span>
                    </div>
                    <div class="card-sub">分类: ${item.category} | ${item.time}</div>
                    <div class="ai-box"><strong>${item.personaName}：</strong>${item.aiComment}</div>
                    <div class="card-footer">
                        <span class="ai-badge">${item.badge}</span>
                        <button class="btn-delete" onclick="deleteExpense(${item.originalIndex})">删除</button>
                    </div>
                `;
                groupEl.appendChild(card);
            });
            listEl.appendChild(groupEl);
        }

        // 更新看板数据
        document.getElementById('totalExpense').innerText = `￥${monthTotal.toFixed(2)}`;
        const percent = Math.min(Math.round((monthTotal / monthlyBudget) * 100), 100);
        document.getElementById('progressFill').style.width = `${percent}%`;
        document.getElementById('budgetPercent').innerText = `预算已用: ${percent}%`;
        document.getElementById('budgetRemain').innerText = `剩余: ￥${(monthlyBudget - monthTotal).toFixed(2)}`;
    }

    function deleteExpense(index) {
        if(confirm('确定要删除这条记账记录吗？')) {
            expenses.splice(index, 1);
            localStorage.setItem('expenses_history_v3', JSON.stringify(expenses));
            renderFeed();
        }
    }

    // 4. 可视化图表渲染 (Chart.js)
    function renderChart() {
        const ctx = document.getElementById('categoryChart').getContext('2d');
        const categoryTotals = {};

        expenses.forEach(item => {
            const cat = item.category || '其他';
            categoryTotals[cat] = (categoryTotals[cat] || 0) + Number(item.amount || 0);
        });

        const labels = Object.keys(categoryTotals);
        const data = Object.values(categoryTotals);

        if(chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: labels.length ? labels : ['暂无数据'],
                datasets: [{
                    data: data.length ? data : [1],
                    backgroundColor: ['#6366f1', '#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6']
                }]
            },
            options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
        });
    }

    // 5. 召唤 AI 生成月度颁奖总结
    async function generateMonthlyReport() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const apiHost = document.getElementById('apiHost').value;
        const modelName = document.getElementById('modelName').value;

        if(!apiKey) return alert('请先在明细设置里填入 API Key！');
        if(expenses.length === 0) return alert('还没有记账数据，先去记几笔吧！');

        const btn = document.getElementById('genReportBtn');
        const resEl = document.getElementById('reportResult');
        btn.disabled = true; btn.innerText = 'AI 正在撰写颁奖词...';

        const summaryData = expenses.map(e => `${e.date} ${e.description} ￥${e.amount} (${e.category})`).join('\n');
        const prompt = `你是一位幽默风趣的高情商情侣财务管家。请分析以下这对情侣近期的账单明细数据，为他们撰写一份《月度消费颁奖典礼与情侣报告》。
结构要求：
1. 🏆 颁发 2~3 个搞笑搞笑极具特色的消费奖项（例如“最高单笔败家奖”、“最强续命奖”等）。
2. 💡 对两人的消费结构进行幽默点评与未来建议。
3. 💕 给予一句关于爱情与生活的温馨祝福。
账单数据：\n${summaryData}`;

        try {
            const response = await fetch(`${apiHost}/chat/completions`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                body: JSON.stringify({
                    model: modelName,
                    messages: [{ role: 'user', content: prompt }]
                })
            });

            const data = await response.json();
            resEl.innerText = data.choices[0].message.content;
            resEl.style.display = 'block';
        } catch(err) {
            alert('生成报告失败：' + err.message);
        } finally {
            btn.disabled = false; btn.innerText = '✨ 重新生成 AI 颁奖总结';
        }
    }

    // 6. 添加记账核心逻辑
    async function addExpense() {
        const inputEl = document.getElementById('userInput');
        const text = inputEl.value.trim();
        const apiKey = document.getElementById('apiKey').value.trim();
        const apiHost = document.getElementById('apiHost').value;
        const modelName = document.getElementById('modelName').value;

        if (!text) return alert('请输入或说出消费内容！');
        if (!apiKey) return alert('请展开设置填入 API Key！');

        const sendBtn = document.getElementById('sendBtn');
        sendBtn.disabled = true; sendBtn.innerText = '分析中...';

        const systemPrompt = `分析用户的消费文本，提取金额和分类，并给出 80 字以内的特色点评和评价勋章。必须严格只返回 JSON 格式：{"amount": 数字, "category": "餐饮/购物/交通/娱乐/日用/其他", "description": "简短名称", "aiComment": "点评", "badge": "勋章"}`;

        try {
            const response = await fetch(`${apiHost}/chat/completions`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                body: JSON.stringify({
                    model: modelName,
                    messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: text }]
                })
            });

            const data = await response.json();
            const resultText = data.choices[0].message.content;
            const jsonMatch = resultText.match(/\{[\s\S]*\}/);
            const res = JSON.parse(jsonMatch[0]);

            const personaNames = { cat: '🐱 毒舌猫', angel: '👼 夸夸天使', abacus: '🧮 算盘娘', cyber: '🤖 赛博理财' };
            const now = new Date();

            const newRecord = {
                amount: res.amount || 0,
                category: res.category || '其他',
                description: res.description || text,
                aiComment: res.aiComment || '懒得点评...',
                badge: res.badge || '消费达人',
                personaName: personaNames[currentPersona],
                date: now.toISOString().split('T')[0], // YYYY-MM-DD
                time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                timestamp: Date.now() // 时间戳用于半年数据过滤
            };

            expenses.push(newRecord);
            localStorage.setItem('expenses_history_v3', JSON.stringify(expenses));
            
            inputEl.value = '';
            renderFeed();
        } catch (err) {
            alert('记账失败，请检查 Key 或网络：' + err.message);
        } finally {
            sendBtn.disabled = false; sendBtn.innerText = '记账';
        }
    }
</script>
</body>
</html>
